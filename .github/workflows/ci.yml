name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q .

  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            bash -n "$f" || exit 1
          done
      - name: Installer must stay pinned
        run: |
          grep -q 'UPSTREAM_URL=' scripts/install-macos.sh
          grep -q 'PIN_COMMIT=' scripts/install-macos.sh
          grep -q 'PIN_SHA256=' scripts/install-macos.sh
          test "$(grep -c 'PIN_COMMIT=' scripts/install-macos.sh)" = "1"
